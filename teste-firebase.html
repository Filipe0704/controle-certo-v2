<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Teste do Firebase - Controle Certo</title>
    <link rel="stylesheet" href="cc.css">
    <style>
        #resultados { list-style: none; padding: 0; display: grid; gap: 12px; margin: 20px 0; }
    </style>
</head>
<body>
    <main id="conteudo">
        <div class="pagina-titulo">
            <h1>Teste de conexão com o Firebase</h1>
            <p>Página de diagnóstico: confere se o Firebase está configurado, se o login por e-mail e senha está ativo e se o banco de dados está protegido. Você pode apagá-la depois que tudo estiver funcionando.</p>
        </div>

        <section aria-labelledby="titulo-resultados">
            <h2 id="titulo-resultados">Resultados</h2>
            <ul id="resultados" aria-live="polite"></ul>
            <button type="button" class="btn" id="repetir" disabled>Rodar o teste de novo</button>
        </section>
    </main>

    <script type="module" src="teste-firebase.js"></script>
</body>
</html>
